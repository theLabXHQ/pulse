name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -short ./...
      - name: build all platforms
        run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/pulse_* dist/SHA256SUMS \
            --title "Pulse $GITHUB_REF_NAME" --generate-notes
